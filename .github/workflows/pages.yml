name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        # apt mirrors occasionally stall mid-download: make apt give up on a dead
        # connection and retry, and fail the step rather than hang the run
        timeout-minutes: 10
        run: |
          echo 'Acquire::http::Timeout "30"; Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/99-stall-retry
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Build site and CV PDF
        run: node scripts/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
